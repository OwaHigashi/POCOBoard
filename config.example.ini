# POCOBoard config — copy to config.ini next to pocoboard.py.
# Lines starting with # or ; are comments.

# ---- Network ----
http_host       = 0.0.0.0
http_port       = 8080

# ---- Audio / behaviour ----
# Fallback volume (0..100) for the external group when its key is absent.
startup_volume  = 80          ; 0..100 (loud but not clipped)
# Per-group startup volumes (0..100).  FX one-shots (BOMB / CHEER / ...)
# are synthesized loud, while listeners' TALK / uploaded audio / video
# sound is usually much quieter — set these independently to balance
# them.  startup_fx_volume defaults to 30 when omitted; startup_ext_volume
# defaults to startup_volume.  BOMB additionally plays at half the FX
# gain (it is by far the hottest one-shot).  The operator can retune both
# live from the control window's 音量 sliders.
startup_fx_volume  = 30
;startup_ext_volume = 90
# Per-effect gain on top of the 効果音 slider (percent; 100 = slider
# value as-is, 50 = half, up to 400).  BOMB ships at 50 because its
# synth (sub-bass + clipped noise) is far hotter than the others.
fx_volume_bomb_pct   = 50
fx_volume_cheer_pct  = 100
fx_volume_hearts_pct = 100
fx_volume_stars_pct  = 100
fx_volume_snow_pct   = 100
fx_volume_petals_pct = 100
fx_volume_aurora_pct = 100
fx_volume_laser_pct  = 100
fx_volume_sunset_pct = 100
fx_volume_leaves_pct = 100
accept_on_boot  = true
debounce_ms     = 300
# Upload size caps per kind, in MB (0 / omitted = built-in default:
# image 25 / video 200 / audio 50).
;upload_limit_image_mb = 25
;upload_limit_video_mb = 200
;upload_limit_audio_mb = 50

# ---- Display window ----
# Screen index (0-based) where the display window should open.
# -1 = pick the "other" screen (the one NOT holding the control window);
# falls back to screen 0 if only one monitor is present.
display_screen  = -1
# Start the display window fullscreen on boot.
display_fullscreen_on_boot = true
# Initial size of the display window if not fullscreen.
display_width   = 1600
display_height  = 900
# Idle title: after this many quiet seconds (no FX / marquee / TALK /
# media) the POCOBOARD title fades back in.  0 = never return to the
# title (stay on the last background).
idle_return_sec = 300
# Fade-in duration of that title, in milliseconds.
idle_title_fade_ms = 1200
# Opacity (0..100 %) of FX scenes while an uploaded VIDEO is the
# background (photos show FX fully opaque; the camera has its own key
# camera_fx_opacity_pct below).
video_fx_opacity_pct = 75

# ---- Control window ----
# Screen index where the control window should open. -1 = primary.
control_screen  = -1

# ---- Media playback ----
# Default image display time, in seconds.  After this many seconds the
# uploaded image is auto-cleared from the background.  The operator can
# override this live from the control window (表示 tab).
#   0 = never auto-clear (image stays until 停止 is pressed)
image_display_sec = 180
# Minimum playback duration for videos and uploaded audio, in seconds.
# When the clip's natural length is SHORTER than this, playback loops
# (via setPosition + play on end-of-media) until the total elapsed time
# reaches this many seconds, then stops at the next natural end.  Clips
# longer than this play through once.
#   0 = play once, no looping (pre-2026-04-25 behavior for long clips)
media_min_play_sec = 60

# ---- Live camera (USB / virtual camera) ----
# Show a camera feed (USB webcam, capture device, or a virtual camera
# such as OBS) as the display's idle background.  This is the DEFAULT
# mode: whenever no uploaded photo / video is on screen and piano-roll
# mode is off, the camera picture fills the frame.  FX scenes and the
# marquee are drawn semi-transparently on top of it so the picture stays
# visible through them.
camera_on_boot = true
# Which capture device to use.  Empty = system default camera.  Otherwise
# matched against the device list first by exact device id, then by
# case-insensitive substring of the device name (e.g. "ManyCam" picks
# the ManyCam Virtual Webcam, "OBS" the OBS Virtual Camera).  The
# operator can switch live from the 表示 tab.
# Virtual cameras that only register with DirectShow (ManyCam, OBS,
# NVIDIA Broadcast, ...) are invisible to Windows Media Foundation /
# Qt; POCOBoard captures those through its own DirectShow (VMR9)
# backend automatically — they appear in the same device list.
camera_device =
# Opacity (0..100 %) of FX scenes (BOMB / CHEER / ...) while the camera
# feed is visible.  0 hides FX entirely; 100 draws them fully opaque.
camera_fx_opacity_pct      = 55
# Opacity (0..100 %) of the scrolling marquee text while the camera feed
# is visible.
camera_marquee_opacity_pct = 75
# Poll rate (frames per second) for the DirectShow backend (ManyCam /
# OBS virtual cameras).  Lower this if the host CPU struggles.
camera_dshow_poll_fps = 30

# ---- Horizontal correction presets (モード 1 / モード 2) ----
# The camera picture and everything POCOBoard draws itself (FX scenes,
# marquee text, piano roll, uploaded photos / videos, idle title) both
# need a horizontal-only stretch when the output chain squeezes the
# picture.  Two presets are kept and the operator flips between them
# with the 横補正モード buttons on the 表示 tab (both stretches switch
# together):
#   モード 1 = 100 %  (no correction — direct / uncompressed output)
#   モード 2 = 297 %  (calibrated on the real rig, 2026-08-06)
# camera_hstretch_pctN: camera picture, vertical untouched, width scaled
#   about the centre axis, overflow clipped (50..400).
# output_hstretch_pctN: drawn layers compose on a narrower virtual
#   canvas and are stretched to full width on output; the piano-roll
#   keyboard lays out all 88 keys across the virtual width (100..400).
# The spinboxes on the 表示 tab edit whichever preset is active.
camera_hstretch_pct1 = 100
output_hstretch_pct1 = 100
camera_hstretch_pct2 = 297
output_hstretch_pct2 = 297
# Preset active at boot (1 or 2).
hstretch_mode = 2
# (Legacy single-value keys camera_hstretch_pct / output_hstretch_pct are
#  still read and seed preset 2 when the *_pct2 keys are absent.)

# ---- Piano roll (USB MIDI) ----
# Speed at which note bars scroll upward in the piano-roll mode, in pixels
# per second.  Higher = bars travel up the screen faster (shorter visible
# trail per note).
piano_scroll_pps      = 110
# Keyboard height as a percentage of the screen height BEFORE the
# output horizontal correction divides it (the correction narrows the
# keys, so the height shrinks by the same ratio to keep real key
# proportions).  Default 18 → about 6 % of the screen at 297 %.
piano_keyboard_height_pct = 18
# MIDI note range drawn.  21..108 = the full 88 keys (A0..C8).  Narrow
# it (e.g. 36..96) for a 61-key controller so the keys come out wider.
# Notes outside the range are ignored.  Applies from the next
# ピアノロール ON.
piano_note_min = 21
piano_note_max = 108
# Opacity of FX scenes (CHEER / HEARTS / etc.) when stacked on top of the
# piano roll, expressed as a percentage.  0 hides FX entirely; 100 makes
# them fully opaque.  Default 55 keeps both layers comfortably readable.
piano_fx_opacity_pct     = 55
# Opacity of the piano-roll scene ITSELF when a live camera feed is
# underneath (percentage, 0..100).  The camera keeps showing through the
# whole roll; 100 hides the camera completely.  When the camera is off
# the roll always paints fully opaque.  Live-tunable from the piano
# panel in the 表示 tab.  Default 65.
piano_roll_opacity_pct   = 65
# Opacity of uploaded photos overlaid on the piano roll (percentage,
# 0..100).  Lower = the keyboard / scrolling notes show through more
# strongly; raise this if your photos tend to be dark and the piano
# washes them out.  Default 35.
piano_image_opacity_pct  = 35
# Opacity of uploaded videos overlaid on the piano roll (percentage,
# 0..100).  Same trade-off as piano_image_opacity_pct.  Default 35.
piano_video_opacity_pct  = 35
# Piano-roll layout.  false (通常): the roll fills the screen and photos
# / videos / FX overlay it translucently with the opacities above.
# true (コンパクト): the roll is confined to a strip along the bottom of
# the screen and photos / videos / FX show at full brightness above it
# (no dimming); the strip itself is drawn at piano_roll_opacity_pct
# over whatever is beneath.  Switchable live from the piano panel.
piano_compact = false
# Height of the compact strip as a percentage of the screen (10..50).
# Default 25 = a quarter of the screen.  The keyboard keeps the same
# absolute height as in the full layout.
piano_compact_height_pct = 25
# Opacity (0..100 %) of the compact strip when a photo / video / camera
# picture is showing beneath it (opaque over a plain black background).
piano_compact_opacity_pct = 65
# Where the compact strip sits: bottom (default) or top.
piano_compact_position = bottom

# ---- Marquee ----
# Font size in pixels (display-window pixels). Render is GPU-accelerated so
# you can go BIG on a 4K monitor.
marquee_size    = 64
# Global size multiplier (percent) applied on top of marquee_size and the
# per-message <small>/<big> tags.  150 = 1.5x — readable for the audience
# on a typical streaming setup.  Operators can retune this live from the
# control window's 横スクロール tab.  Range: 50..500.
marquee_size_pct = 150
# Scroll speed at speed-stop 1 in pixels per second (stops 1..5 multiply
# it; constant px/s so long and short lines move at the same pace).
marquee_scroll_pps = 320
# On-screen lifetime (seconds) of pinned <ue>/<shita> (top/bottom)
# messages.
marquee_pin_sec = 3.0
# (Removed: marquee_ref_lanes / marquee_wait_per_empty — the PC version
#  has unlimited lanes + overlap, so the old ESP32-era throttle is not
#  needed.  Speed is now fixed pixels-per-second per speed-stop, not a
#  duration.)
