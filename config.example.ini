# POCOBoard config — copy to config.ini next to pocoboard.py.
# Lines starting with # or ; are comments.

# ---- Network ----
http_host       = 0.0.0.0
http_port       = 8080

# ---- Audio / behaviour ----
# Fallback volume (0..100) used when the per-group keys below are absent.
startup_volume  = 80          ; 0..100 (loud but not clipped)
# Per-group startup volumes (0..100).  FX one-shots (BOMB / CHEER / ...)
# are synthesized loud, while listeners' TALK / uploaded audio / video
# sound is usually much quieter — set these independently to balance
# them.  Both default to startup_volume when omitted.  The operator can
# retune both live from the control window's 音量 sliders.
;startup_fx_volume  = 60
;startup_ext_volume = 90
accept_on_boot  = true
debounce_ms     = 300

# ---- Display window ----
# Screen index (0-based) where the display window should open.
# -1 = pick the "other" screen (the one NOT holding the control window);
# falls back to screen 0 if only one monitor is present.
display_screen  = -1
# Start the display window fullscreen on boot.
display_fullscreen_on_boot = true
# Initial size of the display window if not fullscreen.
display_width   = 1600
display_height  = 900

# ---- Control window ----
# Screen index where the control window should open. -1 = primary.
control_screen  = -1

# ---- Media playback ----
# Default image display time, in seconds.  After this many seconds the
# uploaded image is auto-cleared from the background.  The operator can
# override this live from the control window (表示 tab).
#   0 = never auto-clear (image stays until 停止 is pressed)
image_display_sec = 180
# Minimum playback duration for videos and uploaded audio, in seconds.
# When the clip's natural length is SHORTER than this, playback loops
# (via setPosition + play on end-of-media) until the total elapsed time
# reaches this many seconds, then stops at the next natural end.  Clips
# longer than this play through once.
#   0 = play once, no looping (pre-2026-04-25 behavior for long clips)
media_min_play_sec = 60

# ---- Live camera (USB / virtual camera) ----
# Show a camera feed (USB webcam, capture device, or a virtual camera
# such as OBS) as the display's idle background.  This is the DEFAULT
# mode: whenever no uploaded photo / video is on screen and piano-roll
# mode is off, the camera picture fills the frame.  FX scenes and the
# marquee are drawn semi-transparently on top of it so the picture stays
# visible through them.
camera_on_boot = true
# Which capture device to use.  Empty = system default camera.  Otherwise
# matched against the device list first by exact device id, then by
# case-insensitive substring of the device name (e.g. "ManyCam" picks
# the ManyCam Virtual Webcam, "OBS" the OBS Virtual Camera).  The
# operator can switch live from the 表示 tab.
# Virtual cameras that only register with DirectShow (ManyCam, OBS,
# NVIDIA Broadcast, ...) are invisible to Windows Media Foundation /
# Qt; POCOBoard captures those through its own DirectShow (VMR9)
# backend automatically — they appear in the same device list.
camera_device =
# Opacity (0..100 %) of FX scenes (BOMB / CHEER / ...) while the camera
# feed is visible.  0 hides FX entirely; 100 draws them fully opaque.
camera_fx_opacity_pct      = 55
# Opacity (0..100 %) of the scrolling marquee text while the camera feed
# is visible.
camera_marquee_opacity_pct = 75
# Horizontal-only stretch of the camera picture: the vertical size
# stays as-is and the width is scaled about the center axis (overflow
# past the window edges is clipped).  Compensates capture chains that
# deliver a horizontally squeezed picture.  100 = no stretch; the
# shipped default 297 was calibrated on the real rig (2026-08-06) —
# the same value as output_hstretch_pct below; the chain squeezes
# everything once, at the output.
# Adjustable live (50..400 %) from the 表示 tab's 横引き延ばし spinbox.
camera_hstretch_pct = 297

# ---- Output horizontal correction (drawn layers) ----
# Everything POCOBoard draws itself (FX scenes, marquee text, piano
# roll, uploaded photos / videos, idle title) goes through the
# downstream horizontal squeeze, so it is composed on a horizontally
# narrower virtual canvas and stretched to full width on output.  The
# piano-roll keyboard lays out all 88 keys across the virtual width,
# so the full keyboard spans the final screen.  100 = off; shipped
# default 297, rig-calibrated (2026-08-06) — same as
# camera_hstretch_pct.  Adjustable live from the 表示 tab.
output_hstretch_pct = 297

# ---- Piano roll (USB MIDI) ----
# Speed at which note bars scroll upward in the piano-roll mode, in pixels
# per second.  Higher = bars travel up the screen faster (shorter visible
# trail per note).
piano_scroll_pps      = 110
# Opacity of FX scenes (CHEER / HEARTS / etc.) when stacked on top of the
# piano roll, expressed as a percentage.  0 hides FX entirely; 100 makes
# them fully opaque.  Default 55 keeps both layers comfortably readable.
piano_fx_opacity_pct     = 55
# Opacity of the piano-roll scene ITSELF when a live camera feed is
# underneath (percentage, 0..100).  The camera keeps showing through the
# whole roll; 100 hides the camera completely.  When the camera is off
# the roll always paints fully opaque.  Live-tunable from the piano
# panel in the 表示 tab.  Default 65.
piano_roll_opacity_pct   = 65
# Opacity of uploaded photos overlaid on the piano roll (percentage,
# 0..100).  Lower = the keyboard / scrolling notes show through more
# strongly; raise this if your photos tend to be dark and the piano
# washes them out.  Default 35.
piano_image_opacity_pct  = 35
# Opacity of uploaded videos overlaid on the piano roll (percentage,
# 0..100).  Same trade-off as piano_image_opacity_pct.  Default 35.
piano_video_opacity_pct  = 35

# ---- Marquee ----
# Font size in pixels (display-window pixels). Render is GPU-accelerated so
# you can go BIG on a 4K monitor.
marquee_size    = 64
# Global size multiplier (percent) applied on top of marquee_size and the
# per-message <small>/<big> tags.  150 = 1.5x — readable for the audience
# on a typical streaming setup.  Operators can retune this live from the
# control window's 横スクロール tab.  Range: 50..500.
marquee_size_pct = 150
# (Removed: marquee_ref_lanes / marquee_wait_per_empty — the PC version
#  has unlimited lanes + overlap, so the old ESP32-era throttle is not
#  needed.  Speed is now fixed pixels-per-second per speed-stop, not a
#  duration.)
